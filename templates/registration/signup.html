{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<h1>Create your account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Create account</button>
</form>
<p class="lede">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
