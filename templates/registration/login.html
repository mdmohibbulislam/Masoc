{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Log in</button>
</form>
<p class="lede">New here? <a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
